<!-- =============================================
  Página: Verificador de Contraseñas Seguras
  El usuario ingresa una contraseña y la 
  herramienta analiza su fortaleza en tiempo real.
  ============================================= -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contraseñas Seguras — RUNIC</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>

    <!-- Encabezado y navegación idénticos en todas las páginas -->
    <header>
      <div class="header-content">
        <h1>RUNIC</h1>
        <p>Plataforma educativa de ciberseguridad</p>
      </div>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="password.html" class="active">Contraseñas</a></li>
        <li><a href="phishing.html">Phishing</a></li>
        <li><a href="wifi.html">Redes Wi-Fi</a></li>
      </ul>
    </nav>

    <main>
      <!-- 
        Sección principal del verificador de contraseñas.
        Incluye el campo de entrada, la barra de fortaleza
        y la lista de retroalimentación que se actualizan
        con cada tecla que escribe el usuario.
      -->
      <section>
        <h2>Contraseñas Seguras</h2>
        <p>Ingresa una contraseña para verificar su fortaleza. El análisis se realiza en tiempo real mientras escribes.</p>

        <!-- Campo donde el usuario escribe su contraseña -->
        <input
          type="password"
          id="password-input"
          placeholder="Ingresa tu contraseña"
        />

        <!-- Barra visual que indica la fortaleza (débil, media, fuerte) -->
        <div id="strength-bar"></div>

        <!-- Lista de requisitos que la contraseña cumple o no -->
        <div id="password-feedback"></div>
      </section>
    </main>

    <footer>
      <p>&copy; RUNIC.</p>
    </footer>

    <!-- Script específico para el verificador de contraseñas -->
    <script src="js/password.js"></script>
  </body>
</html>
