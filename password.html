<!-- =============================================
  Página: Verificador de Contraseñas Seguras
  El usuario ingresa una contraseña y la 
  herramienta analiza su fortaleza en tiempo real.
  ============================================= -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contraseñas Seguras — RUNIC</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Encabezado y navegación idénticos en todas las páginas -->
    <header>
      <div class="header-content">
        <div class="logo">
          <svg width="36" height="36" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="rune-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6b7cff"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <polygon points="26,6 45,14 45,38 26,46 7,38 7,14" fill="none" stroke="url(#rune-grad)" stroke-width="2" stroke-linejoin="round"/>
            <polyline points="17,23 26,17 35,23 26,37 17,23" fill="none" stroke="url(#rune-grad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <img src="img/RUNIC-logo.jpeg" alt="RUNIC logo" height="44" style="border-radius: 6px;" />
        </div>
        <div class="logo-text">
          <p>Plataforma educativa de ciberseguridad</p>
        </div>
      </div>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="password.html" class="active">Contraseñas</a></li>
        <li><a href="phishing.html">Phishing</a></li>
        <li><a href="wifi.html">Redes Wi-Fi</a></li>
      </ul>
    </nav>

    <main>
      <!-- 
        Sección principal del verificador de contraseñas.
        Incluye el campo de entrada, la barra de fortaleza
        y la lista de retroalimentación que se actualizan
        con cada tecla que escribe el usuario.
      -->
      <section>
        <h2>Contraseñas Seguras</h2>
        <p>
          Ingresa una contraseña para verificar su fortaleza. El análisis se
          realiza en tiempo real mientras escribes.
        </p>

        <!-- Campo donde el usuario escribe su contraseña -->
        <input
          type="password"
          id="password-input"
          placeholder="Ingresa tu contraseña"
        />

        <!-- Barra visual que indica la fortaleza (débil, media, fuerte) -->
        <div id="strength-bar"></div>

        <!-- Lista de requisitos que la contraseña cumple o no -->
        <div id="password-feedback"></div>
      </section>
    </main>

    <footer>
      <p>&copy; RUNIC.</p>
    </footer>

    <!-- Script específico para el verificador de contraseñas -->
    <script src="js/password.js"></script>
  </body>
</html>
